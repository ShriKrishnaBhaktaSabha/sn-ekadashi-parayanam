<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shri Krishna Bhakta Sabha — Ekadashi Parayanam</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#FBF7F0;
    --panel:#FFFFFF;
    --ink:#2B1B12;
    --ink-soft:#6E5C4F;
    --maroon:#7A1E2C;
    --maroon-dark:#5C1620;
    --gold:#B8860B;
    --border:#E7DCC9;
    --good:#3F6B3F;
    --good-bg:#EAF2E8;
    --bad:#A23E2E;
    --bad-bg:#F7E9E5;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:15px;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
    margin:0 0 4px 0;
    letter-spacing:-0.01em;
  }
  h1{font-size:1.5rem;}
  h2{font-size:1.2rem;}
  h3{font-size:1.02rem;color:var(--ink);}
  p{margin:0 0 10px 0;color:var(--ink-soft);}

  a{color:var(--maroon);}

  .topbar{
    background:var(--maroon);
    color:#F6E9DC;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid var(--gold);
  }
  .topbar .brand{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.15rem;
    color:#FBF3E6;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .topbar .brand .brand-logo{
    width:30px;height:30px;border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
    border:1px solid rgba(255,255,255,0.3);
  }
  .topbar .who{
    display:flex;align-items:center;gap:12px;
    font-size:0.88rem;
  }
  .role-badge{
    background:rgba(255,255,255,0.15);
    padding:3px 10px;
    border-radius:20px;
    font-size:0.78rem;
  }
  .logout-btn{
    background:transparent;
    border:1px solid rgba(255,255,255,0.4);
    color:#F6E9DC;
    padding:5px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:0.82rem;
  }
  .logout-btn:hover{background:rgba(255,255,255,0.12);}

  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 60px;}

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:18px;
  }
  .panel-tight{padding:16px 18px;}

  .gate{
    max-width:420px;
    margin:8vh auto 0;
    padding:0 18px;
  }
  .gate .brand-header{
    text-align:center;
    margin-bottom:28px;
  }
  .gate .brand-header .gate-logo{
    width:76px;height:76px;border-radius:50%;
    object-fit:cover;
    margin:0 auto 14px;
    display:block;
    border:2px solid var(--gold);
  }
  .gate .brand-header h1{font-size:1.35rem;}
  .gate .brand-header .gate-subtitle{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:1rem;
    color:var(--maroon);
    margin:2px 0 6px;
  }
  .gate .brand-header p{font-size:0.9rem;margin:0;}

  .tabs{
    display:flex;
    border-bottom:1px solid var(--border);
    margin-bottom:20px;
  }
  .tab-btn{
    flex:1;
    background:none;
    border:none;
    padding:10px 6px;
    font-size:0.88rem;
    font-family:'Inter',sans-serif;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tab-btn.active{
    color:var(--maroon);
    border-bottom-color:var(--maroon);
    font-weight:600;
  }

  label{
    display:block;
    font-size:0.82rem;
    color:var(--ink-soft);
    margin:12px 0 4px;
  }
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=password],input[type=search],select,textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:7px;
    font-size:0.95rem;
    font-family:inherit;
    background:#FDFBF7;
    color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
    border-color:var(--gold);
  }
  .btn{
    display:inline-block;
    background:var(--maroon);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:7px;
    font-size:0.92rem;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .btn:hover{background:var(--maroon-dark);}
  .btn:disabled{opacity:0.5;cursor:default;}
  .btn.secondary{
    background:transparent;
    color:var(--maroon);
    border:1px solid var(--maroon);
  }
  .btn.secondary:hover{background:#FBEFEC;}
  .btn.block{width:100%;margin-top:16px;}
  .btn.small{padding:5px 11px;font-size:0.8rem;}

  .error-msg{
    background:var(--bad-bg);
    color:var(--bad);
    padding:10px 13px;
    border-radius:7px;
    font-size:0.86rem;
    margin:12px 0 0;
  }
  .success-msg{
    background:var(--good-bg);
    color:var(--good);
    padding:10px 13px;
    border-radius:7px;
    font-size:0.86rem;
    margin:12px 0 0;
  }

  .stat-row{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0;}
  .stat{
    flex:1;min-width:140px;
    background:#FDFBF7;
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
  }
  .stat .num{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:600;color:var(--maroon);}
  .stat .label{font-size:0.78rem;color:var(--ink-soft);}

  .roster-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 4px;
    border-bottom:1px solid var(--border);
  }
  .roster-row:last-child{border-bottom:none;}
  .roster-row .name{flex:1;}
  .roster-row .name .rn{color:var(--ink-soft);font-size:0.8rem;}
  .group-dot{
    width:10px;height:10px;border-radius:50%;
    flex-shrink:0;
  }

  .toggle{
    position:relative;
    width:46px;height:26px;
    border-radius:14px;
    background:#D8CFC0;
    cursor:pointer;
    flex-shrink:0;
    border:none;
  }
  .toggle.on{background:var(--good);}
  .toggle .knob{
    position:absolute;top:3px;left:3px;
    width:20px;height:20px;border-radius:50%;
    background:#fff;
    transition:left 0.15s ease;
  }
  .toggle.on .knob{left:23px;}

  .today-card{
    border:1px solid var(--border);
    border-radius:9px;
    padding:14px;
    margin-bottom:12px;
    border-left:4px solid var(--gold);
  }
  .today-card .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .today-card .dashakam{font-family:'Fraunces',serif;font-weight:600;color:var(--maroon);}
  .today-card .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .today-card .fields .full{grid-column:1/-1;}

  table{width:100%;border-collapse:collapse;font-size:0.86rem;}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);}
  th{color:var(--ink-soft);font-weight:600;font-size:0.78rem;}

  .empty-state{
    text-align:center;
    padding:30px 16px;
    color:var(--ink-soft);
  }
  .divider{border:none;border-top:1px solid var(--border);margin:18px 0;}
  .hint{font-size:0.78rem;color:var(--ink-soft);margin-top:6px;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .pill{
    display:inline-block;
    font-size:0.72rem;
    padding:2px 8px;
    border-radius:20px;
    background:#F0E6D2;
    color:var(--maroon-dark);
    font-weight:600;
  }
  .checkbox-list label{display:flex;align-items:center;gap:6px;font-size:0.86rem;color:var(--ink);margin:6px 0;}
  .checkbox-list input{width:auto;}

  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(43,27,18,0.45);
    display:flex;align-items:center;justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-box{
    background:var(--panel);
    border-radius:var(--radius);
    padding:22px;
    max-width:360px;
    width:100%;
  }
</style>
</head>

/* ====================================================================
   STATE
   ==================================================================== */
let session = JSON.parse(sessionStorage.getItem('ekadashi_session') || 'null');
let view = session ? (session.role === 'Admin' ? 'admin' : 'leader') : 'gate';

/* ====================================================================
   API HELPER — POSTs as text/plain to avoid CORS preflight, which
   Apps Script web apps do not support.
   ==================================================================== */
async function api(action, payload) {
  if (WEBAPP_URL.indexOf('PASTE_YOUR') === 0) {
    throw new Error('Set WEBAPP_URL at the top of this file to your deployed Apps Script Web App URL first (see SETUP.md).');
  }
  const body = Object.assign({ action, token: session ? session.token : null }, payload || {});
  const res = await fetch(WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (e) {
    throw new Error('The server sent back an unexpected response instead of data — this usually means several requests hit it at the same moment. Wait a few seconds and try again.');
  }
  if (!json.ok) throw new Error(json.error || 'Something went wrong.');
  return json.data;
}

function saveSession(s) {
  session = s;
  sessionStorage.setItem('ekadashi_session', JSON.stringify(s));
}
function clearSession() {
  session = null;
  sessionStorage.removeItem('ekadashi_session');
  view = 'gate';
  render();
}

function colorForGroup(groupNum) {
  const HUE_STEPS = 12;
  const idx = Math.max(0, Math.floor(Number(groupNum)) - 1);
  const hue = (idx % HUE_STEPS) * (360 / HUE_STEPS);
  const ring = Math.floor(idx / HUE_STEPS) % 2;
  const s = ring === 0 ? 55 : 62, l = ring === 0 ? 68 : 60;
  return `hsl(${hue},${s}%,${l}%)`;
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

/* ====================================================================
   ROOT RENDER
   ==================================================================== */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  if (view === 'gate') { app.appendChild(renderGate()); return; }

  app.appendChild(renderTopbar());
  const wrap = el('<div class="wrap"></div>');
  app.appendChild(wrap);

  if (view === 'admin') renderAdmin(wrap);
  else if (view === 'leader') renderLeader(wrap);
}

function renderTopbar() {
  const bar = el(`
    <div class="topbar">
      <div class="brand"><img src="${LOGO_DATA_URI}" alt="Shri Krishna Bhakta Sabha" class="brand-logo"> Shri Krishna Bhakta Sabha</div>
      <div class="who">
        <span class="role-badge">${session.role === 'Admin' ? 'Admin' : (session.role === 'ZoomLeader' ? 'Zoom Leader' : 'Group Leader')} — ${escapeHtml(session.name)}</span>
        <button class="logout-btn" id="change-pw-btn">Change password</button>
        <button class="logout-btn">Sign out</button>
      </div>
    </div>
  `);
  bar.querySelectorAll('.logout-btn')[1].onclick = clearSession;
  bar.querySelector('#change-pw-btn').onclick = openChangePasswordModal;
  return bar;
}

function openChangePasswordModal() {
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>Change password</h3>
        <label>Current password</label>
        <input type="password" id="cp-old">
        <label>New password (min 6 characters)</label>
        <input type="password" id="cp-new">
        <label>Confirm new password</label>
        <input type="password" id="cp-confirm">
        <div id="cp-msg"></div>
        <div style="display:flex;gap:10px;margin-top:16px;">
          <button class="btn secondary" id="cp-cancel" style="flex:1;">Cancel</button>
          <button class="btn" id="cp-save" style="flex:1;">Save</button>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector('#cp-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (ev) => { if (ev.target === overlay) overlay.remove(); });

  overlay.querySelector('#cp-save').onclick = async (ev) => {
    const oldPassword = overlay.querySelector('#cp-old').value;
    const newPassword = overlay.querySelector('#cp-new').value;
    const confirm = overlay.querySelector('#cp-confirm').value;
    const msg = overlay.querySelector('#cp-msg');
    msg.innerHTML = '';
    if (newPassword !== confirm) { msg.appendChild(el(`<div class="error-msg">New password and confirmation don't match.</div>`)); return; }
    ev.target.disabled = true;
    try {
      await api('changePassword', { oldPassword, newPassword });
      msg.appendChild(el(`<div class="success-msg">Password changed. Use it next time you sign in.</div>`));
      setTimeout(() => overlay.remove(), 1400);
    } catch (e) {
      msg.appendChild(el(`<div class="error-msg">${escapeHtml(e.message)}</div>`));
      ev.target.disabled = false;
    }
  };
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ====================================================================
   GATE — login (Admin / Leader) or public Devotee lookup
   ==================================================================== */
function renderGate() {
  const wrap = el(`
    <div class="gate">
      <div class="brand-header">
        <img src="${LOGO_DATA_URI}" alt="Shri Krishna Bhakta Sabha" class="gate-logo">
        <h1>Shri Krishna Bhakta Sabha</h1>
        <h2 class="gate-subtitle">Ekadashi Parayanam — Sriman Narayaneeyam</h2>
        <p>Scheduling &amp; recitation tracker</p>
      </div>
      <div class="panel">
        <div class="tabs">
          <button class="tab-btn active" data-tab="devotee">My schedule</button>
          <button class="tab-btn" data-tab="login">Leader / Admin sign in</button>
        </div>
        <div id="gate-body"></div>
      </div>
    </div>
  `);

  const body = wrap.querySelector('#gate-body');
  function showDevotee() { body.innerHTML = ''; body.appendChild(renderDevoteeLookup()); }
  function showLogin() { body.innerHTML = ''; body.appendChild(renderLoginForm()); }

  wrap.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      wrap.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      btn.dataset.tab === 'devotee' ? showDevotee() : showLogin();
    };
  });
  showDevotee();
  return wrap;
}

function renderLoginForm() {
  const form = el(`
    <div>
      <label>Username</label>
      <input type="text" id="login-user" autocomplete="username" list="login-user-suggestions" placeholder="Start typing your name…">
      <datalist id="login-user-suggestions"></datalist>
      <label>Password</label>
      <input type="password" id="login-pass" autocomplete="current-password">
      <button class="btn block" id="login-btn">Sign in</button>
      <div id="login-err"></div>
    </div>
  `);

  // Populate the name suggestions once, quietly — this is a convenience
  // dropdown, so a failure here should never block the sign-in form itself.
  api('listLoginNames').then(data => {
    const datalist = form.querySelector('#login-user-suggestions');
    (data.entries || []).forEach(entry => {
      datalist.appendChild(el(`<option value="${escapeHtml(entry.username)}">${escapeHtml(entry.name)}</option>`));
    });
  }).catch(() => { /* suggestions are optional; sign-in still works by typing the full username */ });

  const doLogin = async () => {
    const username = form.querySelector('#login-user').value.trim();
    const password = form.querySelector('#login-pass').value;
    const errBox = form.querySelector('#login-err');
    errBox.innerHTML = '';
    if (!username || !password) { errBox.appendChild(el(`<div class="error-msg">Enter your username and password.</div>`)); return; }
    try {
      const data = await api('login', { username, password });
      saveSession(data);
      view = data.role === 'Admin' ? 'admin' : 'leader';
      render();
    } catch (e) {
      errBox.innerHTML = '';
      errBox.appendChild(el(`<div class="error-msg">${escapeHtml(e.message)}</div>`));
    }
  };
  form.querySelector('#login-btn').onclick = doLogin;
  form.querySelector('#login-pass').addEventListener('keydown', ev => { if (ev.key === 'Enter') doLogin(); });
  return form;
}

function renderDevoteeLookup() {
  const wrap = el(`
    <div>
      <p>No login needed. Search your roll number or name to see your upcoming portion and recitation history.</p>
      <input type="search" id="dv-query" placeholder="Roll number or name">
      <button class="btn block" id="dv-search">Search</button>
      <div id="dv-results"></div>
    </div>
  `);
  const results = wrap.querySelector('#dv-results');

  async function search(exact) {
    const q = wrap.querySelector('#dv-query').value.trim();
    results.innerHTML = '';
    if (!q) return;
    try {
      const data = await api('devoteeLookup', { query: q, exact: exact || undefined });
      if (data.matches && data.matches.length > 1) {
        const list = el(`<div class="hint" style="margin-top:14px;">Multiple matches — pick one:</div>`);
        results.appendChild(list);
        data.matches.forEach(m => {
          const row = el(`<div class="roster-row" style="cursor:pointer;"><div class="name">${escapeHtml(m.name)} <span class="rn">#${escapeHtml(m.rollNumber)}</span></div></div>`);
          row.onclick = () => search(m.rollNumber);
          results.appendChild(row);
        });
      } else if (data.matches && data.matches.length === 0) {
        results.appendChild(el(`<div class="empty-state">No devotee found matching "${escapeHtml(q)}".</div>`));
      } else if (data.person) {
        results.appendChild(renderDevoteeCard(data));
      }
    } catch (e) {
      results.appendChild(el(`<div class="error-msg">${escapeHtml(e.message)}</div>`));
    }
  }
  wrap.querySelector('#dv-search').onclick = () => search();
  wrap.querySelector('#dv-query').addEventListener('keydown', ev => { if (ev.key === 'Enter') search(); });
  return wrap;
}

function renderDevoteeCard(data) {
  const p = data.person;
  const card = el(`
    <div class="panel panel-tight" style="margin-top:16px;">
      <div class="flex-between">
        <h3>${escapeHtml(p.name)}</h3>
        <span class="pill">Group ${escapeHtml(p.group)}</span>
      </div>
      <p style="margin-top:4px;">Roll number ${escapeHtml(p.rollNumber)}${p.portion ? ' · Portion: ' + escapeHtml(p.portion) : ''}</p>
      <hr class="divider">
      <h3>Upcoming</h3>
      ${data.upcoming ? `<p style="color:var(--ink);">${escapeHtml(data.upcoming.date)} — <strong>${escapeHtml(data.upcoming.dashakam)}</strong>${data.upcoming.tentativeTime ? ` · tentatively around <strong>${escapeHtml(data.upcoming.tentativeTime)}</strong>` : ''}</p>` : `<p>No upcoming portion allotted yet.</p>`}
      <hr class="divider">
      <h3>Recitation history</h3>
      ${data.recited && data.recited.length ? `<table><thead><tr><th>Date</th><th>Recited</th></tr></thead><tbody>${

  return card;
}

async function loadDashboard(box) {
  try {
    const d = await api('adminDashboard');
    box.innerHTML = '';
    box.appendChild(el(`

        <div class="stat"><div class="num">${d.totalDevotees}</div><div class="label">Active devotees</div></div>

    const pacePanel = el(`

        <h3>Recitation pace</h3>
        <p>Used to estimate each devotee's "Tentative Time" when you set a start time while generating a tab — so they know roughly when to log in for their turn.</p>

        <div class="panel panel-tight" style="margin-bottom:12px;">

            <div><strong>Next Ekadashi: ${d.needConfirmDate}</strong><div class="hint">No confirmation tab yet — create it so Leaders can mark attendance.</div></div>

        msg.appendChild(el(`<div class="error-msg">${escapeHtml(e.message)}</div>`));
      }
      ev.target.disabled = false;
    };

      const startGroup = specificPanel.querySelector('#specific-startgroup').value.trim();
      const restrictedStartGroup = specificPanel.querySelector('#specific-restricted-startgroup').value.trim();

      const msg = specificPanel.querySelector('#specific-msg');
      msg.innerHTML = '';
      if (!dateVal) { msg.appendChild(el(`<div class="error-msg">Pick a date first.</div>`)); return; }

  } catch (e) {
    box.innerHTML = '';
    box.appendChild(el(`<div class="error-msg">${escapeHtml(e.message)}</div>`));
  }
}

    const table = el(`<table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Groups</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>`);

async function loadAttendance(box) {
  try {
    const data = await api('leaderGetConfirmationRoster');
    box.innerHTML = '';
    if (!data.sheetName) { box.appendChild(el(`<div class="panel empty-state">No confirmation tab is open right now. Check back once the admin generates one.</div>`)); return; }

    const locked = !!data.locked;
    const panel = el(`
      <div class="panel">
        <h2>${data.date ? 'Ekadashi — ' + data.date : data.sheetName}</h2>
        ${locked
          ? `<p style="color:var(--maroon);">The Ekadashi tab for this date has already been generated, so attendance is locked — changes here would no longer match what was actually allotted. Contact the admin if a correction is needed.</p>`
          : `<p>Toggle off anyone who will NOT be present. Everyone defaults to present.</p>`}
        <div id="attend-rows"></div>
        ${locked ? '' : `<button class="btn block" id="attend-save">Save attendance</button>`}
        <div id="attend-msg"></div>
      </div>
    `);
    const rowsBox = panel.querySelector('#attend-rows');
    const state = {};
    data.rows.forEach(r => {
      state[r.rollNumber] = r.present;
      const row = el(`
        <div class="roster-row">
          <span class="group-dot" style="background:${colorForGroup(r.group)};"></span>
          <div class="name">${escapeHtml(r.name)} <span class="rn">#${escapeHtml(r.rollNumber)}</span></div>
          <button class="toggle ${r.present ? 'on' : ''}" ${locked ? 'disabled style="opacity:0.5;cursor:default;"' : ''}><span class="knob"></span></button>
        </div>
      `);
      if (!locked) {
        row.querySelector('.toggle').onclick = (ev) => {
          state[r.rollNumber] = !state[r.rollNumber];
          ev.currentTarget.classList.toggle('on', state[r.rollNumber]);
        };
      }
      rowsBox.appendChild(row);
    });

    if (!locked) {
      panel.querySelector('#attend-save').onclick = async (ev) => {
        ev.target.disabled = true;
        const msg = panel.querySelector('#attend-msg');
        msg.innerHTML = '';
        try {
          const rows = Object.keys(state).map(rn => ({ rollNumber: rn, present: state[rn] }));
          const r = await api('leaderSubmitAttendance', { rows });
          msg.appendChild(el(`<div class="success-msg">Saved — ${r.updated} update(s).</div>`));
        } catch (e) {
          msg.appendChild(el(`<div class="error-msg">${escapeHtml(e.message)}</div>`));
        }
        ev.target.disabled = false;
      };
    }
    box.appendChild(panel);
  } catch (e) {
    box.innerHTML = '';
    box.appendChild(el(`<div class="error-msg">${escapeHtml(e.message)}</div>`));
  }
}

            </div>
            <div>
              <label style="margin-top:0;">Status</label>
              <select class="f-status">${data.statusOptions.map(o => `<option value="${escapeHtml(o)}" ${o === r.status ? 'selected' : ''}>${o || '(none)'}</option>`).join('')}</select>
            </div>
            <div class="full">
              <label style="margin-top:0;">Recited by (if not assignee / substitute)</label>
              <input type="text" class="f-recitedby" value="${escapeHtml(r.recitedBy || '')}" placeholder="Roll number of substitute">
            </div>
            <div class="full">
              <label style="margin-top:0;">Remarks</label>
              <input type="text" class="f-remarks" value="${escapeHtml(r.remarks || '')}">
            </div>
            <div class="full">
              <button class="btn small f-save">Save</button>
              <span class="f-msg"></span>
            </div>
          </div>
        </div>
      `);
      card.querySelector('.f-save').onclick = async (ev) => {
        ev.target.disabled = true;
        const msg = card.querySelector('.f-msg');
        msg.textContent = '';
        try {
          await api('leaderUpdateTodayRow', {
            rowIndex: r.rowIndex,
            role: card.querySelector('.f-role').value,
            status: card.querySelector('.f-status').value,
            recitedBy: card.querySelector('.f-recitedby').value.trim(),
            remarks: card.querySelector('.f-remarks').value.trim()
          });
          msg.textContent = 'Saved ✓';
          msg.style.color = 'var(--good)';
        } catch (e) {
          msg.textContent = e.message;
          msg.style.color = 'var(--bad)';
        }
        ev.target.disabled = false;
      };
      cardsBox.appendChild(card);
    });
    box.appendChild(panel);
  } catch (e) {
    box.innerHTML = '';
    box.appendChild(el(`<div class="error-msg">${escapeHtml(e.message)}</div>`));
  }
}

/* ====================================================================
   BOOT
   ==================================================================== */
render();
</script>
</body>
</html>
